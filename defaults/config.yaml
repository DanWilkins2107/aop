# AOP machine config, shared by all projects. Lives at ~/.aop/config.yaml.
# Relative paths start from this file's folder. `~` is your home folder.

# Required. The command that starts an agent session. AOP appends `-p` and sends the
# prompt on stdin. AOP doesn't ship or check a sandbox, so point this at your own
# sandboxed wrapper before letting agents run unattended. Agents can't ask you to
# approve tool use, so consider auto mode: add `--permission-mode auto` here, or set
# permissions.defaultMode to "auto" in ~/.claude/settings.json.
agent_session_command: claude

# Optional. Used only by `aop steer <node> --no-sandbox`.
out_of_sandbox_command: claude

# Where sessions start for projects with no path.
open_from: ~/code

# An agent running longer than this moves its node to failed.
agent_timeout_minutes: 60

# The process: stages, types and their prompts. Can live anywhere.
stages: ./stages.yaml

# Optional. Projects that follow a process of their own instead, by project ID (shown in the project's
# settings). Each file is checked like the one above, and its prompts live in its own folder.
# project_stages:
#   <project id>: ./other-stages.yaml

# The improvement pipeline: how changes to your skills and stage prompts are drafted, reviewed and
# applied. Leave it out to turn improvements off.
improvement_stages: ./improvement_stages.yaml

# The folder improvements may change, along with your stage prompts. Raise PR is offered only
# when it's inside a git repo. Never config.yaml or a stages file.
improvements_path: ./skills
