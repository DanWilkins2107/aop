# The whole process, shared by all projects. config.yaml links here.
# Edit freely: AOP validates this file on start and shows problems in the UI.
#
# - A stage has `turn: agent` or `turn: human` and an optional `color`. Agent stages need a
#   `prompt`, a file inside this file's folder.
# - A type is a small graph: its `start` stage, and each stage's `next`, mapping an outcome (an
#   agent's `aop next <outcome>`, or a human's button) to a stage in the type, another type
#   (entering at its start), `done` or `broken_down`. `next` lives on the type, so one stage can
#   be used in several types.
# - Built-in names are reserved: done, broken_down, invalidated, ask_human_question, failed,
#   externally_blocked, splitting and scheduled. A stage and a type can't share a name.

start: triage                 # the type new nodes start in

stages:                       # pool of every stage
  awaiting_agent_breakdown: { turn: agent, color: "#5c7cfa", prompt: ./prompts/awaiting_agent_breakdown.md }
  split_proposed:      { turn: human, color: "#ffc107" }
  split_approved:      { turn: agent, color: "#4263eb", prompt: ./prompts/split_approved.md }
  human_only_action:   { turn: human, color: "#ff9800" }
  implement:           { turn: agent, color: "#12b886", prompt: ./prompts/implement.md }
  pr_review:           { turn: human, color: "#9775fa" }
  second_human_review: { turn: human, color: "#e91e63" }
  decision:            { turn: human, color: "#cc5de8" }
  awaiting_agent_clarification: { turn: agent, color: "#15aabf", prompt: ./prompts/awaiting_agent_clarification.md }

types:                        # a mini graph for each part of the workflow
  triage:
    start: awaiting_agent_breakdown
    stages:
      awaiting_agent_breakdown: { next: { ready: dev, split: split_proposed, human_only: human_only_action, decision: decisions } }
      human_only_action: { next: { done: done } }
      split_proposed:    { next: { approve: split_approved, reject: awaiting_agent_breakdown } }
      split_approved:    { next: { done: broken_down } }
  dev:
    start: implement
    stages:
      implement:           { next: { pr_raised: pr_review } }
      pr_review:           { next: { approve: second_human_review, changes: implement } }
      second_human_review: { next: { merged: done, changes: implement } }
  decisions:                  # a choice for a human, who can ask an agent to look into it first
    start: decision
    stages:
      decision:                     { next: { decided: done, clarify: awaiting_agent_clarification } }
      awaiting_agent_clarification: { next: { clarified: decision } }
