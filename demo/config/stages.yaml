# The example from specs/stages.md, copied into a throwaway AOP_HOME by demo/start.ts.
start: triage                 # the type new nodes start in

stages:                       # pool of every stage
  assess:         { turn: agent, color: "#7088e0", prompt: ./prompts/assess.md }
  split_proposed: { turn: human, color: "#f0c84f" }
  split_approved: { turn: agent, color: "#4a63c4", prompt: ./prompts/split_approved.md }
  human_only_action: { turn: human, color: "#b8c25c" }
  implement:      { turn: agent, color: "#35a98b", prompt: ./prompts/implement.md }
  pr_review:      { turn: human, color: "#a48be6" }
  second_human_review: { turn: human, color: "#d96aa6" }

types:                        # a mini graph for each part of the workflow
  triage:
    start: assess
    stages:
      assess:         { next: { ready: dev, split: split_proposed, human_only: human_only_action } }
      human_only_action: { next: { done: done } }
      split_proposed: { next: { approve: split_approved, reject: assess } }
      split_approved: { next: {} }    # finishes through `aop split finish`
  dev:
    start: implement
    stages:
      implement:           { next: { pr_raised: pr_review } }
      pr_review:           { next: { approve: second_human_review, changes: implement } }
      second_human_review: { next: { merged: done, changes: implement } }
